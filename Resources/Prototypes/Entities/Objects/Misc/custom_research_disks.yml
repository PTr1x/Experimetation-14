# Custom Research Data Disks
# Data disks with research points for use with CustomResearchConsole
# NOTE: Requires C# ResearchDataDiskComponent to be implemented for full functionality

# Base prototype for research data disks
- type: entity
  id: BaseCustomResearchDataDisk
  parent: BaseItem
  name: research data disk
  description: A data disk containing research points for specialized R&D tasks.
  abstract: true
  components:
    - type: Sprite
      sprite: Objects/Misc/disk.rsi
      state: icon
    - type: Item
      size: Tiny
    - type: StaticPrice
      price: 500
    - type: Tag
      tags:
        - ResearchDisk
        - DataDisk

# Tier 1 Research Data Disk - 1000 points
- type: entity
  id: CustomResearchDataDiskTier1
  parent: BaseCustomResearchDataDisk
  name: tier 1 research data disk
  description: A basic data disk containing 1000 research points for entry-level R&D tasks.
  suffix: T1
  components:
    - type: Sprite
      sprite: Objects/Misc/disk.rsi
      state: disk-blue
    - type: StaticPrice
      price: 500

